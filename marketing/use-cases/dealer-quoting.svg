<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="dqTitle dqDesc">
  <title id="dqTitle">Dealer quoting</title>
  <desc id="dqDesc">Branded configurator share link for dealer quoting</desc>
  <defs>
    <style>
      .bg { fill: #fffcf8; }
      .surface { fill: #f0ece6; }
      .ink { fill: #1a1f1e; }
      .muted { fill: #5f6563; }
      .accent { fill: #0891b2; }
      .frame { fill: none; stroke: rgba(26,31,30,0.12); stroke-width: 1.25; }
      .line { stroke: rgba(26,31,30,0.18); stroke-width: 1.5; fill: none; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; }
    </style>
  </defs>
  <rect class="bg" width="640" height="400"/>
  <!-- Browser chrome -->
  <g transform="translate(72,56)">
    <rect class="surface" width="496" height="288" rx="4"/>
    <rect class="frame" width="496" height="288" rx="4"/>
    <rect x="0" y="0" width="496" height="36" fill="#fff" stroke="rgba(26,31,30,0.1)" stroke-width="1"/>
    <circle cx="22" cy="18" r="4" fill="rgba(26,31,30,0.2)"/>
    <circle cx="38" cy="18" r="4" fill="rgba(26,31,30,0.2)"/>
    <circle cx="54" cy="18" r="4" fill="rgba(26,31,30,0.2)"/>
    <rect x="88" y="10" width="280" height="16" rx="2" fill="#f0ece6"/>
    <text class="mono muted" x="96" y="22">share / dealer</text>
    <!-- Left params -->
    <rect x="24" y="56" width="160" height="200" rx="2" fill="#fff" stroke="rgba(26,31,30,0.1)"/>
    <text class="mono accent" x="36" y="80">OPTIONS</text>
    <rect x="36" y="96" width="120" height="10" rx="1" fill="#f0ece6"/>
    <rect x="36" y="118" width="96" height="10" rx="1" fill="#f0ece6"/>
    <rect x="36" y="140" width="108" height="10" rx="1" fill="#f0ece6"/>
    <rect x="36" y="172" width="120" height="28" rx="2" class="accent"/>
    <text fill="#fffcf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" x="58" y="190">REQUEST QUOTE</text>
    <!-- Right preview -->
    <rect x="204" y="56" width="268" height="200" rx="2" fill="#fff" stroke="rgba(26,31,30,0.1)"/>
    <path class="line" d="M280 180 L340 120 L400 180 Z"/>
    <circle cx="340" cy="150" r="28" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text class="label ink" x="248" y="88">LIVE PREVIEW</text>
  </g>
</svg>
