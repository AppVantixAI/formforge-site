<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Before and after quoting workflow">
  <title>Before vs after VendorCAD</title>
  <rect width="960" height="280" fill="#f6f4f0"/>
  <!-- Before -->
  <rect x="24" y="28" width="420" height="224" fill="#fffcf8" stroke="#ddd9d2"/>
  <text x="44" y="56" fill="#8a3d3d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em">BEFORE</text>
  <text x="44" y="84" fill="#1a1f1e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Manual quote loop</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5f6563">
    <text x="44" y="120">1. Email size request</text>
    <text x="44" y="148">2. Engineer redraws in CAD</text>
    <text x="44" y="176">3. Static PDF mockup</text>
    <text x="44" y="204">4. Re-quote after revisions</text>
  </g>
  <!-- Arrow -->
  <path d="M460 140h40" stroke="#0891b2" stroke-width="2"/>
  <path d="M492 132l16 8-16 8" fill="none" stroke="#0891b2" stroke-width="2"/>
  <!-- After -->
  <rect x="516" y="28" width="420" height="224" fill="#fffcf8" stroke="#ddd9d2"/>
  <text x="536" y="56" fill="#0891b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em">AFTER</text>
  <text x="536" y="84" fill="#1a1f1e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Configure to STEP</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5f6563">
    <text x="536" y="120">1. Approved options on the web</text>
    <text x="536" y="148">2. Live 3D preview on the call</text>
    <text x="536" y="176">3. Rules block invalid configs</text>
    <text x="536" y="204">4. STEP + structured quote data</text>
  </g>
</svg>
