<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
  <title>Modular grid pattern</title>
  <defs>
    <pattern id="ff-mod" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1a1f1e" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="0" y="0" width="1" height="1" fill="#0891b2" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="64" height="64" fill="url(#ff-mod)"/>
</svg>
