<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">VendorCAD workflow pipeline</title>
  <desc id="wfDesc">Four steps: parametric model, approved options, live 3D, STEP export</desc>
  <defs>
    <style>
      .bg { fill: #fffcf8; }
      .frame { fill: none; stroke: rgba(26,31,30,0.12); stroke-width: 1; }
      .ink { fill: #1a1f1e; }
      .muted { fill: #5f6563; }
      .accent { fill: #0891b2; }
      .surface { fill: #f0ece6; }
      .line { stroke: rgba(26,31,30,0.18); stroke-width: 1.5; fill: none; }
      .arrow { stroke: #0891b2; stroke-width: 1.75; fill: none; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.14em; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="220" rx="4"/>

  <!-- Connector line -->
  <path class="arrow" d="M250 88 H310 M530 88 H590 M810 88 H870" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Step 01: Parametric -->
  <g transform="translate(24,28)">
    <rect class="surface" width="220" height="120" rx="2"/>
    <rect class="frame" width="220" height="120" rx="2"/>
    <text class="mono accent" x="16" y="28">01</text>
    <!-- Schema nodes -->
    <rect x="28" y="44" width="56" height="18" rx="2" fill="#fff" stroke="#0891b2" stroke-width="1.25"/>
    <rect x="104" y="44" width="56" height="18" rx="2" fill="#fff" stroke="rgba(26,31,30,0.25)" stroke-width="1"/>
    <rect x="66" y="78" width="72" height="18" rx="2" fill="#fff" stroke="rgba(26,31,30,0.25)" stroke-width="1"/>
    <path class="line" d="M56 62 V78 M132 62 V78 M102 78"/>
    <text class="label ink" x="16" y="148">Parametric</text>
    <text class="body muted" x="16" y="168">Approved dims &amp; rules</text>
  </g>

  <!-- Step 02: Options -->
  <g transform="translate(304,28)">
    <rect class="surface" width="220" height="120" rx="2"/>
    <rect class="frame" width="220" height="120" rx="2"/>
    <text class="mono accent" x="16" y="28">02</text>
    <!-- Option list -->
    <rect x="28" y="42" width="164" height="12" rx="1" fill="#fff"/>
    <rect x="28" y="42" width="48" height="12" rx="1" class="accent"/>
    <rect x="28" y="62" width="164" height="12" rx="1" fill="#fff" stroke="rgba(26,31,30,0.15)"/>
    <rect x="28" y="82" width="164" height="12" rx="1" fill="#fff" stroke="rgba(26,31,30,0.15)"/>
    <circle cx="176" cy="68" r="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <circle cx="176" cy="68" r="2.5" class="accent"/>
    <text class="label ink" x="16" y="148">Options</text>
    <text class="body muted" x="16" y="168">Safe choices on the web</text>
  </g>

  <!-- Step 03: 3D -->
  <g transform="translate(584,28)">
    <rect class="surface" width="220" height="120" rx="2"/>
    <rect class="frame" width="220" height="120" rx="2"/>
    <text class="mono accent" x="16" y="28">03</text>
    <!-- Isometric block cue -->
    <path d="M110 48 L158 72 L158 100 L110 124 L62 100 L62 72 Z" fill="#fff" stroke="#1a1f1e" stroke-width="1.25"/>
    <path d="M110 48 L158 72 L110 96 L62 72 Z" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1"/>
    <path d="M110 96 L158 72 L158 100 L110 124 Z" fill="rgba(26,31,30,0.06)"/>
    <text class="label ink" x="16" y="148">Live 3D</text>
    <text class="body muted" x="16" y="168">Preview while quoting</text>
  </g>

  <!-- Step 04: STEP -->
  <g transform="translate(864,28)">
    <rect class="surface" width="232" height="120" rx="2"/>
    <rect class="frame" width="232" height="120" rx="2"/>
    <text class="mono accent" x="16" y="28">04</text>
    <rect x="40" y="48" width="72" height="54" rx="2" fill="#fff" stroke="#0891b2" stroke-width="1.5"/>
    <text class="mono ink" x="52" y="80" style="font-size:14px;letter-spacing:0.06em">STEP</text>
    <path d="M140 58 H196 M140 74 H184 M140 90 H172" stroke="#5f6563" stroke-width="2" stroke-linecap="round"/>
    <text class="label ink" x="16" y="148">STEP export</text>
    <text class="body muted" x="16" y="168">Manufacturing-ready data</text>
  </g>
</svg>
