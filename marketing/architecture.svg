<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">VendorCAD capability architecture</title>
  <desc id="archDesc">CAD rules feed a web configurator that delivers 3D preview, share links, STEP, and manufacturing data</desc>
  <defs>
    <style>
      .canvas { fill: #f6f4f0; }
      .panel { fill: #fffcf8; stroke: rgba(26,31,30,0.12); stroke-width: 1; }
      .panel-dark { fill: #0c1010; }
      .ink { fill: #1a1f1e; }
      .ink-inv { fill: #f6f4f0; }
      .muted { fill: #5f6563; }
      .muted-inv { fill: rgba(246,244,240,0.62); }
      .accent { fill: #0891b2; }
      .accent-stroke { stroke: #0891b2; fill: none; stroke-width: 1.75; }
      .flow { stroke: rgba(26,31,30,0.28); stroke-width: 1.5; fill: none; }
      .flow-accent { stroke: #0891b2; stroke-width: 1.75; fill: none; }
      .kicker { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; }
      .chip { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="canvas" width="960" height="520" rx="4"/>

  <!-- Left: CAD / rules source -->
  <g transform="translate(40,60)">
    <rect class="panel" width="220" height="400" rx="3"/>
    <text class="kicker accent" x="20" y="36">Source of truth</text>
    <text class="title ink" x="20" y="64">Parametric CAD</text>
    <text class="body muted" x="20" y="88">Approved product families</text>

    <rect x="20" y="120" width="180" height="56" rx="2" fill="#f0ece6"/>
    <text class="chip ink" x="34" y="144">Dimensions &amp; ranges</text>
    <text class="body muted" x="34" y="164">Engineering-locked</text>

    <rect x="20" y="192" width="180" height="56" rx="2" fill="#f0ece6"/>
    <text class="chip ink" x="34" y="216">Option trees</text>
    <text class="body muted" x="34" y="236">Materials � finishes � kits</text>

    <rect x="20" y="264" width="180" height="56" rx="2" fill="#f0ece6"/>
    <text class="chip ink" x="34" y="288">Constraint rules</text>
    <text class="body muted" x="34" y="308">Manufacturable only</text>

    <rect x="20" y="336" width="180" height="36" rx="2" class="accent"/>
    <text class="chip ink-inv" x="34" y="359">Validated configuration</text>
  </g>

  <!-- Flow arrows into core -->
  <path class="flow-accent" d="M270 260 H320" marker-end="url(#a)"/>

  <!-- Center: VendorCAD platform -->
  <g transform="translate(330,60)">
    <rect class="panel-dark" width="300" height="400" rx="3"/>
    <text class="kicker" x="24" y="36" fill="#22d3ee">Platform</text>
    <text class="title ink-inv" x="24" y="64">VendorCAD configurator</text>
    <text class="body muted-inv" x="24" y="88">Web experience for buyers &amp; sales</text>

    <!-- Inner modules -->
    <rect x="24" y="120" width="252" height="72" rx="2" fill="#151c1b" stroke="rgba(26,138,131,0.45)"/>
    <text class="chip ink-inv" x="40" y="148">Rules engine</text>
    <text class="body muted-inv" x="40" y="170">Gates invalid option combos</text>

    <rect x="24" y="208" width="252" height="72" rx="2" fill="#151c1b" stroke="rgba(246,244,240,0.12)"/>
    <text class="chip ink-inv" x="40" y="236">Live 3D viewport</text>
    <text class="body muted-inv" x="40" y="258">Browser preview � no CAD seat</text>

    <rect x="24" y="296" width="252" height="72" rx="2" fill="#151c1b" stroke="rgba(246,244,240,0.12)"/>
    <text class="chip ink-inv" x="40" y="324">Share &amp; quote links</text>
    <text class="body muted-inv" x="40" y="346">Frozen parameters per session</text>

    <rect x="24" y="384" width="252" height="44" rx="2" fill="#0891b2"/>
    <text class="chip ink-inv" x="40" y="411">Export pipeline � STEP / data</text>
  </g>

  <!-- Flow out -->
  <path class="flow-accent" d="M640 180 H690" marker-end="url(#a)"/>
  <path class="flow-accent" d="M640 260 H690" marker-end="url(#a)"/>
  <path class="flow-accent" d="M640 340 H690" marker-end="url(#a)"/>
  <path class="flow-accent" d="M640 410 H690" marker-end="url(#a)"/>

  <!-- Right: outputs -->
  <g transform="translate(700,60)">
    <rect class="panel" width="220" height="400" rx="3"/>
    <text class="kicker accent" x="20" y="36">Outputs</text>
    <text class="title ink" x="20" y="64">Manufacturing handoff</text>

    <g transform="translate(20,112)">
      <rect width="180" height="52" rx="2" fill="#f0ece6"/>
      <circle cx="22" cy="26" r="6" class="accent"/>
      <text class="chip ink" x="40" y="22">STEP solid</text>
      <text class="body muted" x="40" y="40">When config is valid</text>
    </g>
    <g transform="translate(20,180)">
      <rect width="180" height="52" rx="2" fill="#f0ece6"/>
      <circle cx="22" cy="26" r="6" class="accent"/>
      <text class="chip ink" x="40" y="22">3D preview</text>
      <text class="body muted" x="40" y="40">Buyer / dealer sign-off</text>
    </g>
    <g transform="translate(20,248)">
      <rect width="180" height="52" rx="2" fill="#f0ece6"/>
      <circle cx="22" cy="26" r="6" class="accent"/>
      <text class="chip ink" x="40" y="22">Share link</text>
      <text class="body muted" x="40" y="40">Sales-ready session</text>
    </g>
    <g transform="translate(20,316)">
      <rect width="180" height="52" rx="2" fill="#f0ece6"/>
      <circle cx="22" cy="26" r="6" class="accent"/>
      <text class="chip ink" x="40" y="22">Structured data</text>
      <text class="body muted" x="40" y="40">Quote � BOM � ops</text>
    </g>
  </g>
</svg>
